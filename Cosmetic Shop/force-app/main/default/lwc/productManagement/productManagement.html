<template>

    <lightning-card>

        <!-- Header -->

        <div class="header-section">

            <lightning-input
                type="search"
                placeholder="Search Products..."
                onchange={handleSearch}
                class="search-box">
            </lightning-input>

            <div class="header-actions">

                <lightning-button
                    label="Filter"
                    icon-name="utility:filterList"
                    onclick={toggleFilters}>
                </lightning-button>

                <lightning-button
                    label="Add Product"
                    icon-name="utility:add"
                    variant="brand"
                    onclick={openModal}>
                </lightning-button>

            </div>

        </div>



        <!--    Filters     -->
        <template if:true={showFilters}>

            <div class="filter-panel">

                <lightning-combobox
                    label="Category"
                    value={selectedCategory}
                    options={categoryFilterOptions}
                    onchange={handleCategoryFilter}>
                </lightning-combobox>

                <lightning-combobox
                    label="Availability"
                    value={selectedAvailability}
                    options={availabilityOptions}
                    onchange={handleAvailabilityFilter}>
                </lightning-combobox>

                <lightning-combobox
                    label="Price Range"
                    value={selectedPriceRange}
                    options={priceOptions}
                    onchange={handlePriceFilter}>
                </lightning-combobox>

                <div class="filter-buttons">

                    <lightning-button
                        label="Clear"
                        onclick={clearFilters}>
                    </lightning-button>

                    <lightning-button
                        label="Apply"
                        variant="brand"
                        onclick={applyFilters}>
                    </lightning-button>

                </div>

            </div>

        </template>

        <!-- Loader -->


        <template if:true={isLoading}>

            <div class="spinner-container">

                <lightning-spinner
                    size="large"
                    alternative-text="Loading">
                </lightning-spinner>

            </div>

        </template>

        <!-- Empty State -->

        <template if:false={products.length}>

            <div class="empty-state">

                <lightning-icon
                    icon-name="standard:product"
                    size="large">
                </lightning-icon>

                <h2>No Products Available</h2>

                <p>
                    Add your first cosmetic product.
                </p>

            </div>

        </template>

        <!-- Product Grid -->

        <div class="product-grid">

            <template
                for:each={products}
                for:item="product">

                <div
                    key={product.productId}
                    class="product-card">

                    <!-- Product Image -->

                    <template if:true={product.imageUrl}>

                        <img src={product.imageUrl} alt={product.name}>

                    </template>

                    <template if:false={product.imageUrl}>

                        <div class="image-placeholder">

                            <lightning-icon
                                icon-name="standard:product"
                                size="large">
                            </lightning-icon>

                        </div>

                    </template>

                    <!-- Product Content -->

                    <div class="product-content">

                        <div class="product-category">
                            {product.category}
                        </div>

                        <h2 class="product-name">
                            {product.name}
                        </h2>

                        <div class="price-stock-wrapper">

                            <span class="product-price">
                                ₹ {product.price}
                            </span>

                            <span class={product.stockClass}>
                                {product.stockLabel}
                            </span>

                        </div>

                    </div>

                    <!-- Actions -->

                    <div class="button-section">

                        <lightning-button
                            label="Edit"
                            variant="brand"
                            data-id={product.productId}
                            onclick={handleEdit}>
                        </lightning-button>

                        <lightning-button
                            label="Delete"
                            variant="destructive"
                            data-id={product.productId}
                            onclick={handleDelete}>
                        </lightning-button>

                    </div>

                </div>

            </template>

        </div>

        <!-- CREATE PRODUCT MODAL -->

        <template if:true={showModal}>

            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container custom-modal">

                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_large modal-title">
                            Create Product
                        </h2>

                    </header>

                    <div
                        class="slds-modal__content slds-p-around_large">

                        <!-- Preview Image -->

                        <template if:true={previewImage}>

                            <div class="edit-image-container">

                                <img
                                    src={previewImage}
                                    alt="Preview"
                                    class="modal-image-preview" />

                            </div>

                        </template>

                        <!-- Product Name -->

                        <lightning-input
                            label="Product Name"
                            value={productName}
                            required
                            onchange={handleProductName}>
                        </lightning-input>

                        <!-- Category -->

                        <lightning-combobox
                            label="Category"
                            value={category}
                            options={categoryOptions}
                            required
                            onchange={handleCategory}>
                        </lightning-combobox>

                        <!-- Price -->

                        <lightning-input
                            type="number"
                            label="Price"
                            value={price}
                            required
                            onchange={handlePrice}>
                        </lightning-input>

                        <!-- Stock Quantity -->

                        <lightning-input
                            type="number"
                            label="Stock Quantity"
                            value={stockQuantity}
                            required
                            onchange={handleStockQuantity}>
                        </lightning-input>

                        <!-- Description -->

                        <lightning-textarea
                            label="Description"
                            value={description}
                            onchange={handleDescription}>
                        </lightning-textarea>

                        <!-- Image Upload -->

                        <lightning-input
                            type="file"
                            label="Upload Product Image"
                            accept="image/png,image/jpeg"
                            onchange={handleFileChange}>
                        </lightning-input>

                    </div>

                    <footer class="slds-modal__footer">

                        <lightning-button
                            label="Cancel"
                            onclick={closeModal}>
                        </lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Save Product"
                            onclick={saveProduct}>
                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open">
            </div>

        </template>

        <!-- EDIT MODAL -->

        <template if:true={showEditModal}>

            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container custom-modal">

                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_large modal-title">
                            Edit Product
                        </h2>

                    </header>

                    <div
                        class="slds-modal__content slds-p-around_large">

                        <!-- Existing Image Preview -->

                        <!-- Existing Product Image -->

<template if:true={editImagePreview}>

    <div class="edit-image-container">
        <img class="edit-image-preview" src={editImagePreview} alt={name}>
    </div>

</template>

<div class="edit-form-grid">

    <lightning-input
        label="Product Name"
        value={editProductName}
        onchange={handleEditName}>
    </lightning-input>

    <lightning-combobox
        label="Category"
        value={editCategory}
        options={categoryOptions}
        onchange={handleEditCategory}>
    </lightning-combobox>

    <lightning-input
        type="number"
        label="Price"
        value={editPrice}
        onchange={handleEditPrice}>
    </lightning-input>

    <lightning-input
        type="number"
        label="Stock Quantity"
        value={editStockQuantity}
        onchange={handleEditStock}>
    </lightning-input>

</div>

<lightning-textarea
    label="Description"
    value={editDescription}
    onchange={handleEditDescription}>
</lightning-textarea>

<lightning-input
    type="file"
    label="Replace Product Image"
    accept="image/png,image/jpeg"
    onchange={handleEditFileChange}>
</lightning-input>

                    </div>

                    <footer class="slds-modal__footer">

                        <lightning-button
                            label="Cancel"
                            onclick={closeEditModal}>
                        </lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            variant="brand"
                            label="Update Product"
                            onclick={updateExistingProduct}>
                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open">
            </div>

        </template>

    </lightning-card>

</template>
