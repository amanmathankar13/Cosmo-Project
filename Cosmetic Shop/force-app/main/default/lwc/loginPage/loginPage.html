<template>

    <lightning-card title="Customer Login">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Username"
                type="email"
                value={username}
                onchange={handleUsername}>
            </lightning-input>


            <lightning-input
                label="Password"
                type="password"
                value={password}
                onchange={handlePassword}>
            </lightning-input>


            <lightning-button
                label="Login"
                variant="brand"
                onclick={handleLogin}>
            </lightning-button>


            <template if:true={errorMessage}>
                <p class="error">
                    {errorMessage}
                </p>
            </template>


        </div>

    </lightning-card>

</template>
