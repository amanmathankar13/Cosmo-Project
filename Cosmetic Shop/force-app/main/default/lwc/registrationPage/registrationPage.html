<template>

    <lightning-card title="Create Account">

        <lightning-input
            label="First Name"
            data-field="firstName"
            onchange={handleChange}>
        </lightning-input>


        <lightning-input
            label="Last Name"
            data-field="lastName"
            onchange={handleChange}>
        </lightning-input>


        <lightning-input
            label="Email"
            type="email"
            data-field="email"
            onchange={handleChange}>
        </lightning-input>


        <lightning-input
            label="Phone"
            data-field="phone"
            onchange={handleChange}>
        </lightning-input>



        <lightning-button
            label="Register"
            variant="brand"
            onclick={register}>
        </lightning-button>



        <p>{message}</p>


    </lightning-card>

</template>
